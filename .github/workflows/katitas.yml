name: Check Katitas property count

on:
  schedule:
    # 16:45 JST = 07:45 UTC. Run before the 17:30 notification.
    - cron: "45 7 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check current property count
        run: python katitas.py

      - name: Upload screenshots and page text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katitas-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
